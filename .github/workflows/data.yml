name: Data

# Takes carbon-cost's datasets (tariffs/data: its workflows build each table
# from the official sources and convert it to ORCT right away), validates
# them, checks that carbon-cost's calculator prices them as the reference
# calculator does, and commits the result if it changed.
on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: "17 4 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: data
  cancel-in-progress: false

jobs:
  data:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/checkout@v5
        with:
          repository: majidkabir/carbon-cost
          path: _carbon-cost
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - run: pip install jsonschema
      - name: Take carbon-cost's datasets
        run: |
          rm -rf data/carbon-cost
          cp -r _carbon-cost/tariffs/data data/carbon-cost
      - name: Validate
        run: python3 tools/validate.py data/carbon-cost tests/fixtures
      - name: Schemas match their generator
        run: python3 tools/gen_schema.py && git diff --exit-code schema
      - name: Conformance vectors
        run: python3 tests/run_vectors.py
      - name: Specification examples
        run: python3 tests/check_spec_examples.py
      - name: Price every charge once
        run: python3 tests/smoke.py data/carbon-cost
      - uses: actions/setup-go@v6
        with:
          go-version-file: _carbon-cost/go.mod
          cache-dependency-path: _carbon-cost/go.sum
      - name: carbon-cost's calculator gives the reference calculator's statements
        run: |
          python3 tests/record.py data/carbon-cost /tmp/recorded.jsonl
          cd _carbon-cost && ORCT_RECORDED=/tmp/recorded.jsonl ORCT_DATA="$GITHUB_WORKSPACE/data/carbon-cost" go test ./orct -run TestRecordedStatements -v -timeout 0
      - name: Commit
        if: github.event_name != 'pull_request'
        run: |
          rm -rf _carbon-cost
          git add -A data
          if git diff --cached --quiet; then echo "No change"; exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Data: carbon-cost's datasets"
          git push
