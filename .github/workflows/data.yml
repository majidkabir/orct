name: Data

# Regenerates data/carbon-cost from carbon-cost's tables, validates it,
# checks nothing was lost and that it prices as carbon-cost does, and commits
# the result if it changed.
on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: "17 4 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: data
  cancel-in-progress: false

jobs:
  data:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/checkout@v5
        with:
          repository: majidkabir/carbon-cost
          path: _carbon-cost
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - run: pip install jsonschema
      - name: Convert
        run: |
          rm -rf data/carbon-cost
          python3 tools/convert_carbon_cost.py _carbon-cost data/carbon-cost --commit "$(git -C _carbon-cost rev-parse HEAD)"
      - name: Validate
        run: python3 tools/validate.py data/carbon-cost tests/fixtures
      - name: Schemas match their generator
        run: python3 tools/gen_schema.py && git diff --exit-code schema
      - name: Check nothing was lost
        run: python3 tools/check_lossless.py _carbon-cost data/carbon-cost
      - uses: actions/setup-go@v6
        with:
          go-version-file: _carbon-cost/go.mod
          cache-dependency-path: _carbon-cost/go.sum
      - name: Compare with carbon-cost's own engine (every 10th case)
        run: |
          mkdir -p _carbon-cost/cmd/orctoracle && cp tools/oracle/main.go _carbon-cost/cmd/orctoracle/
          (cd _carbon-cost && go run ./cmd/orctoracle) > /tmp/oracle.jsonl
          python3 tools/check_oracle.py /tmp/oracle.jsonl data/carbon-cost --every 10
      - name: Conformance vectors
        run: python3 tests/run_vectors.py
      - name: Specification examples
        run: python3 tests/check_spec_examples.py
      - name: Price every charge once
        run: python3 tests/smoke.py data/carbon-cost
      - name: Commit
        if: github.event_name != 'pull_request'
        run: |
          rm -rf _carbon-cost
          git add -A data
          if git diff --cached --quiet; then echo "No change"; exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Data: carbon-cost tables as ORCT"
          git push
